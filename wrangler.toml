name = "uraan-daycare-school"
main = "_worker.bundle.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── Non-secret environment variables ────────────────────────────────────────
# Safe to commit — no credentials here.
[vars]
PORT     = "3000"
NODE_ENV = "production"

